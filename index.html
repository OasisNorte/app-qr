<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Info QR</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
    .card {
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 2px 2px 10px #999;
      display: inline-block;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <div id="info">Cargando...</div>

  <script>
    async function main() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (!id) {
        document.getElementById("info").innerHTML = "<p>No se proporcionó ID</p>";
        return;
      }

      try {
        const res = await fetch("data.json");
        const data = await res.json();

        if (data[id]) {
          const persona = data[id];
          document.getElementById("info").innerHTML = `
            <div class="card">
              <h2>${persona.nombre}</h2>
              <p>${persona.descripcion}</p>
            </div>
          `;
        } else {
          document.getElementById("info").innerHTML = "<p>ID no encontrado</p>";
        }
      } catch (e) {
        document.getElementById("info").innerHTML = "<p>Error al cargar los datos</p>";
      }
    }

    main();
  </script>
</body>
</html>
