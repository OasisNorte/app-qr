<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información de Persona</title>
    <style>
        /* Estilos generales de la página */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        /* Estilo del contenedor de la información de la persona */
        #persona-info {
            margin-top: 50px;
        }

        /* Estilo para el nombre */
        #nombre {
            font-size: 36px; /* Nombre más pequeño */
            font-weight: bold;
            color: #333;
        }

        /* Estilo para la descripción */
        #descripcion {
            font-size: 72px; /* Descripción mucho más grande */
            color: #555;
            margin-top: 20px;
        }

        /* Estilo para el fondo de la página */
        #container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: auto;
        }

    </style>
</head>
<body>
    <div id="container">
        <div id="persona-info">
            <h2 id="nombre"></h2>
            <p id="descripcion"></p>
        </div>
    </div>

    <script>
        // Obtener el ID del parámetro URL
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        // Cargar los datos desde el archivo JSON
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                // Encontrar la persona correspondiente al ID
                const persona = data.find(person => person.id == id);

                if (persona) {
                    // Actualizar la información en la página
                    document.getElementById('nombre').innerText = persona.nombre;
                    document.getElementById('descripcion').innerText = persona.descripcion;
                } else {
                    document.getElementById('nombre').innerText = 'Persona no encontrada';
                    document.getElementById('descripcion').innerText = '';
                }
            })
            .catch(error => {
                console.error('Error al cargar el archivo JSON:', error);
                document.getElementById('nombre').innerText = 'Error al cargar la información';
                document.getElementById('descripcion').innerText = '';
            });
    </script>
</body>
</html>
